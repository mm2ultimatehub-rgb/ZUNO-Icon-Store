<!doctype html>
<html lang="tr">

      <div style="padding:18px;border:1px solid #53678f;border-radius:14px;background:#1a2740;text-align:center;font-size:32px;font-weight:700;letter-spacing:.32em;color:#fff;">{{ .Token }}</div>
