<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071214" />
    <meta name="description" content="ZUNO Icon Store — ZUNO için topluluk tarafından oluşturulan ikonlar." />
    <meta name="application-name" content="ZUNO Icon Store" />
    <link rel="icon" type="image/svg+xml" href="./zuno-logo.svg?v=2" />
    <link rel="shortcut icon" href="./zuno-logo.svg?v=2" />
    <title>ZUNO Icon Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; min-width: 320px; min-height: 100%; background: #071214; color: #f5f6fb; font-family: Inter, system-ui, sans-serif; }
      #startup { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; box-sizing: border-box; background: radial-gradient(ellipse at 50% 45%, rgba(72,174,157,.20), transparent 48%), #071214; }
      #startup strong { font-family: Sora, Inter, sans-serif; font-size: 14px; letter-spacing: .08em; }
      #startup p { color: #b4b9cc; margin: 0; font-size: 14px; }
      .startup-orb { width: 116px; height: 116px; position: relative; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 32% 25%,rgba(190,255,244,.22),rgba(55,126,116,.18) 52%,rgba(5,22,23,.86)); border: 1px solid rgba(207,255,245,.28); box-shadow: inset 0 1px 14px rgba(255,255,255,.12),0 0 48px rgba(91,212,190,.18); }
      .startup-orb:before { content: ""; width: 68px; height: 68px; border-radius: 42% 58% 62% 38% / 43% 38% 62% 57%; background: linear-gradient(135deg,rgba(255,255,255,.9),rgba(145,235,216,.72) 52%,rgba(77,165,148,.56)); border: 1px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 8px rgba(255,255,255,.6),0 8px 24px rgba(103,225,202,.28); animation: startup-morph 3.2s ease-in-out infinite, startup-spin 8s linear infinite; }
      .startup-orb:after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); }
      @keyframes startup-morph { 0%,100% { border-radius:42% 58% 62% 38% / 43% 38% 62% 57%; transform:scale(.94); } 50% { border-radius:58% 42% 38% 62% / 55% 62% 38% 45%; transform:scale(1.08); } }
      @keyframes startup-spin { to { rotate: 360deg; } }
      .startup-dots { display:flex; gap:7px; margin-top:2px; }
      .startup-dots i { width:6px;height:6px;border-radius:50%;background:#a3f0e4;opacity:.35;animation:startup-pulse 1.1s ease-in-out infinite; }
      .startup-dots i:nth-child(2){animation-delay:.16s}.startup-dots i:nth-child(3){animation-delay:.32s}
      @keyframes startup-pulse { 50% { opacity:1; transform:translateY(-3px) scale(1.18); } }
      #startup-error { display:none; max-width:320px; color:#ffb8c0; font-size:13px; line-height:1.5; }
      #startup.retry #startup-error { display:block; }
      #startup.retry #startup-status { color:#ffb8c0; }
      #startup-retry { display:none; border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:10px 18px; color:#fff; background:rgba(255,255,255,.1); font:inherit; cursor:pointer; }
      #startup.retry #startup-retry { display:inline-flex; }
      @media (prefers-reduced-motion: reduce) { .startup-orb:before,.startup-dots i { animation:none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup" role="status" aria-live="polite">
        <div class="startup-orb" aria-hidden="true"></div>
        <strong>ZUNO ICON STORE</strong>
        <p id="startup-status">Uygulama yükleniyor…</p>
        <div class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <p id="startup-error">Uygulama dosyaları yüklenemedi. İnternet bağlantını kontrol edip yeniden dene.</p>
        <button id="startup-retry" type="button" onclick="window.location.reload()">Yeniden dene</button>
      </main>
    </div>
    <noscript><p style="text-align:center;color:#b4b9cc">Bu site için JavaScript gerekli.</p></noscript>
    <script>
      (function () {
        var root = document.getElementById("root");
        var timer = window.setTimeout(function () {
          var startup = document.getElementById("startup");
          if (startup && root && root.contains(startup)) {
            startup.classList.add("retry");
            document.getElementById("startup-status").textContent = "Yükleme beklenenden uzun sürdü";
          }
        }, 25000);

        function showStartupError(message) {
          var startup = document.getElementById("startup");
          if (!startup || !root || !root.contains(startup)) return;
          window.clearTimeout(timer);
          startup.classList.add("retry");
          document.getElementById("startup-status").textContent = "Site açılamadı";
          var detail = document.getElementById("startup-error");
          if (detail) detail.textContent = message;
        }

        // Avoid automatic reload loops when a cached or missing bundle fails.
        window.addEventListener("error", function (event) {
          if (event.target && event.target.tagName === "SCRIPT") {
            showStartupError("Site dosyası yüklenemedi. Yeniden dene; sorun sürerse biraz sonra tekrar aç.");
          } else if (!event.target && event.message) {
            showStartupError("Açılış sırasında bir hata oluştu. Sayfayı yenileyip tekrar dene.");
          }
        }, true);

        window.addEventListener("unhandledrejection", function () {
          showStartupError("Site başlatılırken beklenmeyen bir işlem başarısız oldu. Yeniden deneyebilirsin.");
        });

        var observer = new MutationObserver(function () {
          var startup = document.getElementById("startup");
          if (!startup || !root.contains(startup)) {
            window.clearTimeout(timer);
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true, subtree: true });
      })();
    </script>ipt>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
